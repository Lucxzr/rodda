<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>RODDA</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--bd:#262b33;--tx:#eef1f4;--mu:#8b949e;--ac:#7cc4e8;--ok:#4cc38a;--er:#ef6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 2px}h2{font-size:15px;color:var(--mu);font-weight:500;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:32px;font-weight:700}.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;background:#0f1216;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px}
button{background:var(--ac);color:#06202e;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;width:100%}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.sm{width:auto;padding:6px 10px;font-size:13px;background:transparent;color:var(--er);border:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1216;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 2px;color:var(--mu);font-size:11.5px}nav a.on{color:var(--ac);font-weight:600}
.msg{color:var(--er);font-size:14px;min-height:20px}.ok{color:var(--ok)}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://hcvkhqnpuukczczdmvrz.supabase.co','sb_publishable_BKP9I9BT8KMy3-9G-Cy-9w_gILyddVC');
const $=s=>document.querySelector(s),app=$('#app');
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toCents=v=>Math.round(parseFloat(String(v).replace(/\./g,'').replace(',','.')||'0')*100);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let tab='inicio',user=null,mode='login';

async function boot(){const{data}=await sb.auth.getSession();user=data.session?.user||null;render()}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null});

function authView(msg=''){
 app.innerHTML=`<h1>RODDA</h1><p class="mu">Gestão inteligente para quem vive do corre.</p>
 <div class="card">${mode==='signup'?'<input id="nm" placeholder="Seu nome" autocomplete="name">':''}
 <input id="em" type="email" placeholder="E-mail" autocomplete="email">
 <input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="${mode==='login'?'current-password':'new-password'}">
 <div class="msg" id="msg">${msg}</div>
 <button id="go">${mode==='login'?'Entrar':'Criar conta'}</button><br><br>
 <button class="ghost" id="sw">${mode==='login'?'Criar conta nova':'Já tenho conta'}</button>
 ${mode==='login'?'<p class="mu" style="text-align:center" id="fg">Esqueci a senha</p>':''}</div>`;
 $('#sw').onclick=()=>{mode=mode==='login'?'signup':'login';authView()};
 const fg=$('#fg');if(fg)fg.onclick=async()=>{const e=$('#em').value;if(!e)return $('#msg').textContent='Digite seu e-mail primeiro.';
  const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});$('#msg').textContent=error?error.message:'Enviamos um link para seu e-mail.'};
 $('#go').onclick=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;$('#msg').textContent='';
  const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{full_name:$('#nm').value}}});
  if(r.error)return $('#msg').textContent=r.error.message;
  const{data}=await sb.auth.getSession();user=data.session?.user||null;
  if(!user)return $('#msg').textContent='Conta criada. Confirme seu e-mail e entre.';render()};
}

function shell(html){app.innerHTML=html+'<nav>'+TABS.map(([k,l])=>`<a data-t="${k}" class="${tab===k||(k==='mais'&&['metas','veiculos','veiculo','desempenho','perfil'].includes(tab))?'on':''}">${l}</a>`).join('')+'</nav>';
 document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()})}

const total=e=>e.amount_cents+e.tips_cents+(e.bonus_confirmed?e.bonus_cents:0);
function sum(list){const t=list.reduce((s,e)=>s+total(e),0),n=list.reduce((s,e)=>s+e.deliveries,0);
 const min=list.filter(e=>e.minutes_worked>0),mm=min.reduce((s,e)=>s+e.minutes_worked,0),mt=min.reduce((s,e)=>s+total(e),0);
 return{t,n,avg:n?Math.round(t/n):0,hr:mm?Math.round(mt/(mm/60)):0,mm}}

async function loadEarnings(){const{data,error}=await sb.from('earnings').select('*,platforms(name)').order('earned_at',{ascending:false}).limit(500);
 return error?[]:data}

async function render(){
 if(!user)return authView();
 return({inicio,ganhos,despesas,contas,dinheiro,mais,metas,veiculos,veiculo,desempenho,perfil}[tab]||inicio)()}

async function ganhos(){
 shell('<p class="mu">Carregando…</p>');
 const[all,{data:pl}]=await Promise.all([loadEarnings(),sb.from('platforms').select('name')]);
 const days={};all.forEach(e=>{const k=new Date(e.earned_at).toLocaleDateString('pt-BR');(days[k]=days[k]||[]).push(e)});
 shell(`<h1>Ganhos</h1><div class="card">
 <input id="app_" list="pls" placeholder="Aplicativo (iFood, 99Food, Keeta…)"><datalist id="pls">${(pl||[]).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <input id="val" inputmode="decimal" placeholder="Valor recebido (R$)">
 <div class="grid"><input id="ent" inputmode="numeric" placeholder="Entregas"><input id="min" inputmode="numeric" placeholder="Minutos trabalhados"></div>
 <div class="grid"><input id="bon" inputmode="decimal" placeholder="Bônus (R$)"><input id="tip" inputmode="decimal" placeholder="Gorjeta (R$)"></div>
 <label class="mu"><input type="checkbox" id="bc" style="width:auto;margin-right:8px">Bônus já confirmado</label><br><br>
 <div class="msg" id="msg"></div><button id="add">Salvar ganho</button></div>
 ${Object.entries(days).map(([k,l])=>`<h2>${k} · ${brl(sum(l).t)}</h2>`+l.map(e=>`<div class="card row"><div><b>${brl(total(e))}</b><div class="mu">${esc(e.platforms?.name||'Sem app')} · ${e.deliveries} entregas</div></div><button class="sm" data-id="${e.id}">Excluir</button></div>`).join('')).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#val').value);if(!v)return $('#msg').textContent='Informe o valor recebido.';
  let pid=null;const nm=$('#app_').value.trim();
  if(nm){let{data:ex}=await sb.from('platforms').select('id').ilike('name',nm).maybeSingle();
   if(!ex){const r=await sb.from('platforms').insert({name:nm}).select('id').single();if(r.error)return $('#msg').textContent=r.error.message.includes('FREE')?r.error.message:r.error.message;ex=r.data}pid=ex.id}
  const{error}=await sb.from('earnings').insert({platform_id:pid,amount_cents:v,bonus_cents:toCents($('#bon').value),tips_cents:toCents($('#tip').value),deliveries:parseInt($('#ent').value)||0,minutes_worked:parseInt($('#min').value)||null,bonus_confirmed:$('#bc').checked});
  if(error)return $('#msg').textContent=error.message;ganhos()};
 document.querySelectorAll('button.sm').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este ganho?')){await sb.from('earnings').delete().eq('id',b.dataset.id);ganhos()}})}

const TABS=[['inicio','Início'],['ganhos','Ganhos'],['despesas','Despesas'],['contas','Contas'],['dinheiro','Dinheiro'],['mais','Mais']];
const mStart=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1)};
const inMonth=(d)=>new Date(d)>=mStart();
async function cat(name,kind){let{data:ex}=await sb.from('categories').select('id').ilike('name',name).eq('kind',kind).maybeSingle();
 if(ex)return ex.id;const r=await sb.from('categories').insert({name,kind}).select('id').single();return r.data?.id||null}
const rows=async(t,o)=>{const{data}=await sb.from(t).select('*'+(o?.sel||'')).order(o?.by||'created_at',{ascending:false}).limit(300);return data||[]};
const sumC=(l,k='amount_cents')=>l.reduce((s,e)=>s+(e[k]||0),0);
function bind(id,fn){document.querySelectorAll(id).forEach(b=>b.onclick=()=>fn(b.dataset.id))}

async function inicio(){
 shell('<p class="mu">Carregando…</p>');
 const[all,ex,{data:prof}]=await Promise.all([loadEarnings(),rows('expenses',{by:'spent_at'}),sb.from('profiles').select('*').single()]);
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),wk=new Date(d0-6*864e5),mo=mStart();
 const f=d=>all.filter(e=>new Date(e.earned_at)>=d),today=sum(f(d0)),week=sum(f(wk)),month=sum(f(mo));
 const work=sumC(ex.filter(e=>e.kind==='work'&&inMonth(e.spent_at))),profit=month.t-work;
 const p=prof||{split_bills_pct:50,split_personal_pct:30,split_reserve_pct:20,split_base:'gross'};
 const base=p.split_base==='net'?Math.max(profit,0):month.t,r=pc=>brl(Math.round(base*pc/100));
 shell(`<div class="row"><h1>Olá${prof?.full_name?', '+esc(prof.full_name.split(' ')[0]):''}</h1><button class="sm" id="pf" style="color:var(--ac)">Perfil</button></div>
 <div class="card"><div class="mu">Ganhos de hoje</div><div class="big">${brl(today.t)}</div><div class="mu">${today.n} entregas${today.n?' · média '+brl(today.avg):''}</div></div>
 <div class="grid"><div class="card"><div class="mu">Últimos 7 dias</div><b>${brl(week.t)}</b></div><div class="card"><div class="mu">Este mês</div><b>${brl(month.t)}</b></div>
 <div class="card"><div class="mu">Gasto p/ trabalhar</div><b>${brl(work)}</b></div><div class="card"><div class="mu">Lucro estimado</div><b style="color:${profit<0?'var(--er)':'var(--ok)'}">${brl(profit)}</b></div>
 <div class="card"><div class="mu">Entregas no mês</div><b>${month.n}</b></div><div class="card"><div class="mu">Ganho por hora</div><b>${month.hr?brl(month.hr):'—'}</b></div></div>
 ${all.length?'':'<div class="card"><b>Comece aqui</b><p class="mu">Registre seu primeiro ganho na aba Ganhos.</p></div>'}
 <h2>Divisão do mês (recomendada, base ${p.split_base==='net'?'lucro':'bruto'})</h2><div class="card">
 <div class="row"><span>Contas ${p.split_bills_pct}%</span><b>${r(p.split_bills_pct)}</b></div>
 <div class="row"><span>Pessoal ${p.split_personal_pct}%</span><b>${r(p.split_personal_pct)}</b></div>
 <div class="row"><span>Reserva ${p.split_reserve_pct}%</span><b>${r(p.split_reserve_pct)}</b></div>
 <p class="mu">Valores recomendados. Só vira dinheiro guardado quando você registra em Dinheiro.</p></div>`);
 $('#pf').onclick=()=>{tab='perfil';perfil()}}

async function despesas(){
 shell('<p class="mu">Carregando…</p>');const l=await rows('expenses',{by:'spent_at',sel:',categories(name)'});
 const w=sumC(l.filter(e=>e.kind==='work'&&inMonth(e.spent_at))),p=sumC(l.filter(e=>e.kind==='personal'&&inMonth(e.spent_at)));
 shell(`<h1>Despesas</h1><div class="grid"><div class="card"><div class="mu">Trabalho (mês)</div><b>${brl(w)}</b></div><div class="card"><div class="mu">Pessoais (mês)</div><b>${brl(p)}</b></div></div>
 <div class="card"><select id="kd"><option value="work">Do trabalho</option><option value="personal">Pessoal</option></select>
 <input id="ct" list="cts" placeholder="Categoria (Combustível, Recarga, Internet…)"><datalist id="cts">${['Combustível','Recarga elétrica','Alimentação','Manutenção','Pneus','Peças','Internet','Lazer','Compras'].map(x=>`<option value="${x}">`).join('')}</datalist>
 <input id="vl" inputmode="decimal" placeholder="Valor (R$)"><div class="msg" id="msg"></div><button id="add">Salvar despesa</button></div>
 ${l.map(e=>`<div class="card row"><div><b>${brl(e.amount_cents)}</b><div class="mu">${esc(e.categories?.name||'Sem categoria')} · ${e.kind==='work'?'trabalho':'pessoal'} · ${new Date(e.spent_at).toLocaleDateString('pt-BR')}</div></div><button class="sm" data-id="${e.id}">Excluir</button></div>`).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#vl').value),k=$('#kd').value;if(!v)return $('#msg').textContent='Informe o valor.';
  const n=$('#ct').value.trim(),cid=n?await cat(n,k):null;
  const{error}=await sb.from('expenses').insert({kind:k,category_id:cid,amount_cents:v});if(error)return $('#msg').textContent=error.message;despesas()};
 bind('button.sm',async id=>{if(confirm('Excluir?')){await sb.from('expenses').delete().eq('id',id);despesas()}})}

const billInfo=b=>{const t=new Date(),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),due=new Date(t.getFullYear(),t.getMonth(),Math.min(b.due_day,last));
 const days=Math.ceil((due-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5);
 const st=b.paid_cents>=b.amount_cents?'paid':days<0?'late':b.paid_cents>0?'partial':'pending';
 return{days,st,lbl:{paid:'Pago',late:'Atrasado',partial:'Parcial',pending:'Pendente'}[st],cl:{paid:'var(--ok)',late:'var(--er)',partial:'var(--ac)',pending:'var(--mu)'}[st]}};
async function contas(){
 shell('<p class="mu">Carregando…</p>');const l=await rows('fixed_bills',{by:'due_day'});l.sort((a,b)=>a.due_day-b.due_day);
 const falta=l.reduce((s,b)=>s+Math.max(b.amount_cents-b.reserved_cents-b.paid_cents,0),0);
 shell(`<h1>Contas fixas</h1><div class="card"><div class="mu">Ainda falta juntar</div><div class="big">${brl(falta)}</div></div>
 <div class="card"><input id="nm" placeholder="Nome (Parcela da moto, Internet…)"><div class="grid"><input id="vl" inputmode="decimal" placeholder="Valor (R$)"><input id="dd" inputmode="numeric" placeholder="Dia do vencimento"></div>
 <div class="msg" id="msg"></div><button id="add">Salvar conta</button></div>
 ${l.map(b=>{const i=billInfo(b);return`<div class="card"><div class="row"><b>${esc(b.name)}</b><span style="color:${i.cl}">${i.lbl}</span></div>
 <div class="mu">${brl(b.amount_cents)} · dia ${b.due_day}${i.st==='paid'?'':i.days>=0?' · vence em '+i.days+' dia(s)':' · venceu há '+(-i.days)+' dia(s)'}</div>
 <div class="mu">Reservado ${brl(b.reserved_cents)} · Pago ${brl(b.paid_cents)}</div><br>
 <div class="grid"><button class="ghost" data-a="r" data-id="${b.id}">Reservar</button><button data-a="p" data-id="${b.id}">Registrar pagamento</button></div>
 <br><div class="row"><button class="sm" data-a="n" data-id="${b.id}" style="color:var(--mu)">Reiniciar mês</button><button class="sm" data-a="d" data-id="${b.id}">Excluir</button></div></div>`}).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#vl').value),d=parseInt($('#dd').value);if(!$('#nm').value||!v||!(d>=1&&d<=31))return $('#msg').textContent='Preencha nome, valor e dia (1 a 31).';
  const{error}=await sb.from('fixed_bills').insert({name:$('#nm').value.trim(),amount_cents:v,due_day:d});if(error)return $('#msg').textContent=error.message;contas()};
 document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.a,x=l.find(z=>z.id===id);
  if(a==='d'){if(!confirm('Excluir conta?'))return;await sb.from('fixed_bills').delete().eq('id',id)}
  else if(a==='n'){if(!confirm('Zerar reservado e pago deste mês?'))return;await sb.from('fixed_bills').update({reserved_cents:0,paid_cents:0,status:'pending'}).eq('id',id)}
  else{const v=toCents(prompt(a==='r'?'Quanto você reservou? (R$)':'Quanto foi pago? (R$)')||'0');if(!v)return;
   const u=a==='r'?{reserved_cents:x.reserved_cents+v}:{paid_cents:x.paid_cents+v};
   if(a==='p')u.status=(x.paid_cents+v>=x.amount_cents)?'paid':'partial';await sb.from('fixed_bills').update(u).eq('id',id)}
  contas()})}

const BK={bills:'Contas',personal:'Pessoal',reserve:'Reserva',cdb:'CDB'};
async function dinheiro(){
 shell('<p class="mu">Carregando…</p>');
 const[dp,wd,all,ex,{data:p}]=await Promise.all([rows('deposits',{by:'deposited_at'}),rows('withdrawals',{by:'withdrawn_at'}),loadEarnings(),rows('expenses',{by:'spent_at'}),sb.from('profiles').select('*').single()]);
 const gm=sum(all.filter(e=>inMonth(e.earned_at))).t,wm=sumC(ex.filter(e=>e.kind==='work'&&inMonth(e.spent_at)));
 const base=p?.split_base==='net'?Math.max(gm-wm,0):gm,rec={bills:p?.split_bills_pct??50,personal:p?.split_personal_pct??30,reserve:p?.split_reserve_pct??20};
 const bal=k=>sumC(dp.filter(x=>x.bucket===k))-sumC(wd.filter(x=>x.bucket===k)),dm=k=>sumC(dp.filter(x=>x.bucket===k&&inMonth(x.deposited_at)));
 shell(`<h1>Dinheiro</h1><h2>Saldo guardado (o que você registrou)</h2><div class="grid">${Object.keys(BK).map(k=>`<div class="card"><div class="mu">${BK[k]}</div><b>${brl(bal(k))}</b></div>`).join('')}</div>
 <h2>Neste mês: recomendado × depositado</h2><div class="card">${Object.keys(rec).map(k=>{const r=Math.round(base*rec[k]/100);return`<div class="row"><span>${BK[k]}</span><span class="mu">${brl(r)} rec. · <b style="color:var(--tx)">${brl(dm(k))}</b> dep.</span></div>`}).join('')}</div>
 <div class="card"><select id="tp"><option value="deposits">Depósito (guardei)</option><option value="withdrawals">Retirada (tirei)</option></select>
 <select id="bk">${Object.keys(BK).map(k=>`<option value="${k}">${BK[k]}</option>`).join('')}</select><input id="vl" inputmode="decimal" placeholder="Valor (R$)">
 <div class="msg" id="msg"></div><button id="add">Registrar</button></div>
 ${[...dp.map(x=>({...x,t:'Depósito',d:x.deposited_at,tb:'deposits'})),...wd.map(x=>({...x,t:'Retirada',d:x.withdrawn_at,tb:'withdrawals'}))].sort((a,b)=>new Date(b.d)-new Date(a.d)).slice(0,30).map(x=>`<div class="card row"><div><b>${x.t==='Retirada'?'−':'+'}${brl(x.amount_cents)}</b><div class="mu">${x.t} · ${BK[x.bucket]} · ${new Date(x.d).toLocaleDateString('pt-BR')}</div></div><button class="sm" data-id="${x.id}" data-tb="${x.tb}">Excluir</button></div>`).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#vl').value);if(!v)return $('#msg').textContent='Informe o valor.';
  const t=$('#tp').value;if(t==='withdrawals'&&v>bal($('#bk').value))return $('#msg').textContent='Retirada maior que o saldo registrado.';
  const{error}=await sb.from(t).insert({bucket:$('#bk').value,amount_cents:v});if(error)return $('#msg').textContent=error.message;dinheiro()};
 document.querySelectorAll('button.sm').forEach(b=>b.onclick=async()=>{if(confirm('Excluir registro?')){await sb.from(b.dataset.tb).delete().eq('id',b.dataset.id);dinheiro()}})}

async function metas(){
 shell('<p class="mu">Carregando…</p>');const l=await rows('goals');
 shell(`<h1>Metas</h1><div class="card"><input id="tt" placeholder="Meta (Juntar R$ 500, Parcela da moto…)"><div class="grid"><input id="vl" inputmode="decimal" placeholder="Valor (R$)"><input id="dl" type="date"></div>
 <div class="msg" id="msg"></div><button id="add">Criar meta</button></div>
 ${l.map(g=>{const pc=Math.min(100,Math.round(g.saved_cents*100/g.target_cents)),fl=Math.max(g.target_cents-g.saved_cents,0),dd=g.deadline?Math.ceil((new Date(g.deadline+'T23:59:59')-new Date())/864e5):null;
 return`<div class="card"><div class="row"><b>${esc(g.title)}</b><span class="mu">${pc}%</span></div><div style="background:#0f1216;border-radius:8px;height:8px;margin:10px 0"><div style="width:${pc}%;height:8px;border-radius:8px;background:var(--ac)"></div></div>
 <div class="mu">${brl(g.saved_cents)} de ${brl(g.target_cents)} · falta ${brl(fl)}</div>
 ${dd>0&&fl?`<div class="mu">Estimativa: ${brl(Math.ceil(fl/dd))}/dia ou ${brl(Math.ceil(fl/Math.max(dd/7,1)))}/semana até o prazo (${dd} dias)</div>`:dd<=0&&fl?'<div class="mu" style="color:var(--er)">Prazo vencido</div>':''}<br>
 <div class="grid"><button data-a="a" data-id="${g.id}">Adicionar valor</button><button class="sm" data-a="d" data-id="${g.id}" style="padding:13px">Excluir</button></div></div>`}).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#vl').value);if(!$('#tt').value||!v)return $('#msg').textContent='Informe título e valor.';
  const{error}=await sb.from('goals').insert({title:$('#tt').value.trim(),target_cents:v,deadline:$('#dl').value||null});
  if(error)return $('#msg').textContent=error.message.includes('FREE')?error.message:error.message;metas()};

let vid=null;const VT={bike:'Bicicleta',ebike:'Bicicleta elétrica',emoto:'Moto elétrica',moto:'Moto a combustão',scooter:'Patinete elétrico',other:'Outro'};

async function veiculo(){
 shell('<p class="mu">Carregando…</p>');
 const q=(t,c)=>sb.from(t).select('*').eq('vehicle_id',vid).order(c,{ascending:false}).limit(200).then(r=>r.data||[]);
 const[{data:v},ch,fu,mt]=await Promise.all([sb.from('vehicles').select('*').eq('id',vid).single(),q('charges','charged_at'),q('fuelings','fueled_at'),q('maintenances','done_at')]);
 if(!v){tab='veiculos';return render()}
 const el=ELE.includes(v.type),gas=v.type==='moto';let st='';
 if(el){const g=ch.filter(c=>c.km>0&&c.battery_end_pct>c.battery_start_pct),pc=g.reduce((s,c)=>s+c.battery_end_pct-c.battery_start_pct,0),km=sumC(g,'km'),co=sumC(g,'cost_cents'),kw=sumC(g.filter(c=>c.kwh>0),'kwh'),kk=sumC(g.filter(c=>c.kwh>0),'km');
  st=g.length?`<div class="card"><div class="mu">Autonomia observada</div><b>${n1(km/(pc/100))} km por carga completa</b><br><div class="mu">Custo por km: ${r3(co/km)}${kw?' · Consumo: '+n1(kw/kk*100)+' kWh/100 km':''}</div></div>`:'<p class="mu">Registre recargas com km rodados para ver autonomia e custo por km.</p>'}
 if(gas){const s=[...fu].filter(f=>f.odometer_km).sort((a,b)=>a.odometer_km-b.odometer_km);let km=0,li=0,co=0;for(let i=1;i<s.length;i++){km+=s[i].odometer_km-s[i-1].odometer_km;li+=s[i].liters;co+=s[i].cost_cents}
  st=km>0?`<div class="card"><div class="mu">Consumo médio</div><b>${n1(km/li)} km/l</b><div class="mu">Custo por km: ${r3(co/km)}</div></div>`:'<p class="mu">Registre ao menos 2 abastecimentos com o km do painel para ver consumo e custo por km.</p>'}
 const t0=new Date(Date.now()+7*864e5).toISOString().slice(0,10),alert=m=>(m.remind_at&&m.remind_at<=t0)||(m.remind_km&&(v.odometer_km||0)>=m.remind_km-100);
 shell(`<div class="row"><h1>${esc(v.name)}</h1><button class="sm" id="bk" style="color:var(--ac)">‹ Voltar</button></div><p class="mu">${VT[v.type]} · ${v.odometer_km||0} km <a id="ok" style="color:var(--ac)">atualizar km</a></p>${st}
 ${el?`<h2>Nova recarga</h2><div class="card"><div class="grid"><input id="b1" inputmode="numeric" placeholder="Bateria inicial %"><input id="b2" inputmode="numeric" placeholder="Bateria final %"></div>
 <div class="grid"><input id="kmx" inputmode="decimal" placeholder="Km rodados desde a última"><input id="kwh" inputmode="decimal" placeholder="kWh (opcional)"></div><input id="cst" inputmode="decimal" placeholder="Custo da recarga (R$)"><div class="msg" id="m1"></div><button id="a1">Salvar recarga</button></div>`:''}
 ${gas?`<h2>Novo abastecimento</h2><div class="card"><div class="grid"><input id="lt" inputmode="decimal" placeholder="Litros"><input id="cst" inputmode="decimal" placeholder="Valor (R$)"></div><input id="odo" inputmode="decimal" placeholder="Km do painel"><div class="msg" id="m1"></div><button id="a2">Salvar abastecimento</button></div>`:''}
 <h2>Nova manutenção</h2><div class="card"><input id="mk" placeholder="Serviço (pneu, freio, revisão, bateria…)"><div class="grid"><input id="mc" inputmode="decimal" placeholder="Custo (R$)"><input id="md" type="date"></div>
 <div class="grid"><input id="ra" type="date" title="Lembrar na data"><input id="rk" inputmode="numeric" placeholder="Lembrar no km"></div><p class="mu">Lembrete por data e/ou km (opcional).</p><div class="msg" id="m3"></div><button id="a3">Salvar manutenção</button></div>
 <h2>Histórico</h2>${[...ch.map(c=>({t:'ch',id:c.id,x:`Recarga ${c.battery_start_pct}→${c.battery_end_pct}% · ${brl(c.cost_cents||0)}`,d:c.charged_at})),...fu.map(f=>({t:'fu',id:f.id,x:`Abastecimento ${f.liters} L · ${brl(f.cost_cents)}`,d:f.fueled_at})),...mt.map(m=>({t:'mt',id:m.id,x:`${esc(m.kind)} · ${brl(m.cost_cents||0)}${alert(m)?' · <b style="color:var(--er)">LEMBRETE</b>':''}`,d:m.done_at||''}))].map(h=>`<div class="card row"><div><b>${h.x}</b><div class="mu">${h.d?new Date(h.d+'T12:00').toLocaleDateString('pt-BR'):''}</div></div><button class="sm" data-t="${h.t}" data-id="${h.id}">Excluir</button></div>`).join('')}
 <br><button class="ghost" id="dv" style="color:var(--er)">Excluir veículo</button>`);
 const N=s=>parseFloat(String($(s).value).replace(',','.')),TB={ch:'charges',fu:'fuelings',mt:'maintenances'};
 $('#bk').onclick=()=>{tab='veiculos';render()};
 $('#ok').onclick=async()=>{const k=N_(prompt('Km atual do veículo?'));if(k>=0){await sb.from('vehicles').update({odometer_km:k}).eq('id',vid);veiculo()}};
 const run=async(t,o,m)=>{const{error}=await sb.from(t).insert({vehicle_id:vid,...o});if(error)return $(m).textContent=error.message;veiculo()};
 if($('#a1'))$('#a1').onclick=()=>{const a=N('#b1'),b=N('#b2');if(!(a>=0&&b>a&&b<=100))return $('#m1').textContent='Bateria final deve ser maior que a inicial (0 a 100%).';
  run('charges',{battery_start_pct:a,battery_end_pct:b,km:N('#kmx')||null,kwh:N('#kwh')||null,cost_cents:toCents($('#cst').value)},'#m1')};
 if($('#a2'))$('#a2').onclick=()=>{if(!(N('#lt')>0)||!toCents($('#cst').value))return $('#m1').textContent='Informe litros e valor.';
  run('fuelings',{liters:N('#lt'),cost_cents:toCents($('#cst').value),odometer_km:N('#odo')||null},'#m1')};
 $('#a3').onclick=()=>{if(!$('#mk').value)return $('#m3').textContent='Informe o serviço.';
  run('maintenances',{kind:$('#mk').value.trim(),cost_cents:toCents($('#mc').value),done_at:$('#md').value||null,remind_at:$('#ra').value||null,remind_km:N('#rk')||null},'#m3')};
 document.querySelectorAll('button.sm[data-t]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir?')){await sb.from(TB[b.dataset.t]).delete().eq('id',b.dataset.id);veiculo()}});

const N_=s=>parseFloat(String(s||'').replace(',','.'));

async function desempenho(){
 shell('<p class="mu">Carregando…</p>');
 const l=(await loadEarnings()).filter(e=>new Date(e.earned_at)>=new Date(Date.now()-30*864e5));
 if(!l.length)return shell('<h1>Desempenho</h1><div class="card"><b>Sem dados ainda</b><p class="mu">Registre ganhos (com entregas e minutos) para ver sua análise. Nada aqui é inventado: tudo vem dos seus registros.</p></div>');
 const days=new Set(l.map(e=>new Date(e.earned_at).toLocaleDateString('pt-BR'))),S=sum(l);
 const wd={};l.forEach(e=>{const d=new Date(e.earned_at),k=d.getDay(),ds=d.toLocaleDateString('pt-BR');(wd[k]=wd[k]||{})[ds]=(wd[k][ds]||0)+total(e)});
 const nm=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],avg=Object.entries(wd).map(([k,o])=>[k,Object.values(o).reduce((a,b)=>a+b,0)/Object.keys(o).length]).sort((a,b)=>b[1]-a[1]);
 const pf={};l.forEach(e=>{const k=e.platforms?.name||'Sem app';(pf[k]=pf[k]||[]).push(e)});
 const P=Object.entries(pf).map(([k,x])=>{const s=sum(x),kk=x.filter(e=>e.km>0);return{k,...s,pk:kk.length?sumC(kk.map(e=>({v:total(e)})),'v')/sumC(kk,'km'):0}}).sort((a,b)=>b.t-a.t);
 const best=[...P].filter(p=>p.hr).sort((a,b)=>b.hr-a.hr)[0];
 shell(`<h1>Desempenho</h1><p class="mu">Últimos 30 dias, com base nos seus registros.</p>
 <div class="grid"><div class="card"><div class="mu">Dias trabalhados</div><b>${days.size}</b></div><div class="card"><div class="mu">Entregas/dia</div><b>${n1(S.n/days.size)}</b></div>
 <div class="card"><div class="mu">Média por entrega</div><b>${S.n?brl(S.avg):'—'}</b></div><div class="card"><div class="mu">Ganho por hora</div><b>${S.hr?brl(S.hr):'—'}</b></div>
 <div class="card"><div class="mu">Horas trabalhadas</div><b>${n1(S.mm/60)}</b></div><div class="card"><div class="mu">Melhor dia</div><b>${nm[avg[0][0]]}</b></div></div>
 ${best&&P.length>1?`<div class="card"><div class="mu">App com melhor ganho por hora</div><b>${esc(best.k)} · ${brl(best.hr)}/h</b></div>`:''}
 <h2>Por aplicativo</h2>${P.map(p=>`<div class="card"><div class="row"><b>${esc(p.k)}</b><b>${brl(p.t)}</b></div><div class="mu">${p.n} entregas · média ${p.n?brl(p.avg):'—'} · ${p.hr?brl(p.hr)+'/h':'sem horas'}${p.pk?' · '+r3(p.pk)+'/km':''}</div></div>`).join('')}`)}
function csv(rows){if(!rows.length)return '';const k=Object.keys(rows[0]);return [k.join(';'),...rows.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(';'))].join('\n')}
function baixar(nome,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'}));a.download=nome;document.body.appendChild(a);a.click();a.remove()}
