 let prev=null;
 return a.map(f=>{let odo=f.odometer_km!=null&&f.odometer_km!==''?+f.odometer_km:null;
  if(odo==null&&+f.distance_km>0&&prev!=null)odo=prev+ +f.distance_km;
  if(odo!=null)prev=odo;
  return{...f,odo,full:f.full_tank!==false,liters:+f.liters,cost:+f.cost_cents}})}
// Método dos tanques cheios consecutivos: só entra na conta o trecho entre dois tanques cheios
// com km conhecido; os litros de abastecimentos parciais no meio do trecho são somados.
function fuelSegments(list){
 const a=fuelPrep(list),seg=[];let base=null,acc=[];

  if(base!==null)acc.push(f);
  if(f.full&&f.odo!=null){
   if(base!==null){const dist=f.odo-base.odo,L=acc.reduce((s,x)=>s+x.liters,0),C=acc.reduce((s,x)=>s+x.cost,0);
    if(dist>0&&L>0)seg.push({id:f.id,date:f.fueled_at,dist,liters:L,cost:C,kmL:dist/L,costKm:C/dist})}
   base=f;acc=[]}}
 return seg}
