<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>RODDA</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--bd:#262b33;--tx:#eef1f4;--mu:#8b949e;--ac:#7cc4e8;--ok:#4cc38a;--er:#ef6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 2px}h2{font-size:15px;color:var(--mu);font-weight:500;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:32px;font-weight:700}.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;background:#0f1216;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px}
button{background:var(--ac);color:#06202e;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;width:100%}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.sm{width:auto;padding:6px 10px;font-size:13px;background:transparent;color:var(--er);border:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1216;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 4px;color:var(--mu);font-size:13px}nav a.on{color:var(--ac);font-weight:600}
.msg{color:var(--er);font-size:14px;min-height:20px}.ok{color:var(--ok)}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://czcuxoaplhdjgzmigbzd.supabase.co','sb_publishable_AYyaoxO2vcPkIDpyC3Aj-g_Kn7IAw13');
const $=s=>document.querySelector(s),app=$('#app');
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toCents=v=>Math.round(parseFloat(String(v).replace(/\./g,'').replace(',','.')||'0')*100);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let tab='inicio',user=null,mode='login';

async function boot(){const{data}=await sb.auth.getSession();user=data.session?.user||null;render()}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null});

function authView(msg=''){
 app.innerHTML=`<h1>RODDA</h1><p class="mu">Gestão inteligente para quem vive do corre.</p>
 <div class="card">${mode==='signup'?'<input id="nm" placeholder="Seu nome" autocomplete="name">':''}
 <input id="em" type="email" placeholder="E-mail" autocomplete="email">
 <input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="${mode==='login'?'current-password':'new-password'}">
 <div class="msg" id="msg">${msg}</div>
 <button id="go">${mode==='login'?'Entrar':'Criar conta'}</button><br><br>
 <button class="ghost" id="sw">${mode==='login'?'Criar conta nova':'Já tenho conta'}</button>
 ${mode==='login'?'<p class="mu" style="text-align:center" id="fg">Esqueci a senha</p>':''}</div>`;
 $('#sw').onclick=()=>{mode=mode==='login'?'signup':'login';authView()};
 const fg=$('#fg');if(fg)fg.onclick=async()=>{const e=$('#em').value;if(!e)return $('#msg').textContent='Digite seu e-mail primeiro.';
  const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});$('#msg').textContent=error?error.message:'Enviamos um link para seu e-mail.'};
 $('#go').onclick=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;$('#msg').textContent='';
  const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{full_name:$('#nm').value}}});
  if(r.error)return $('#msg').textContent=r.error.message;
  const{data}=await sb.auth.getSession();user=data.session?.user||null;
  if(!user)return $('#msg').textContent='Conta criada. Confirme seu e-mail e entre.';render()};
}

function shell(html){app.innerHTML=html+`<nav><a data-t="inicio" class="${tab==='inicio'?'on':''}">Início</a><a data-t="ganhos" class="${tab==='ganhos'?'on':''}">Ganhos</a><a data-t="perfil" class="${tab==='perfil'?'on':''}">Perfil</a></nav>`;
 document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()})}

const total=e=>e.amount_cents+e.tips_cents+(e.bonus_confirmed?e.bonus_cents:0);
function sum(list){const t=list.reduce((s,e)=>s+total(e),0),n=list.reduce((s,e)=>s+e.deliveries,0);
 const min=list.filter(e=>e.minutes_worked>0),mm=min.reduce((s,e)=>s+e.minutes_worked,0),mt=min.reduce((s,e)=>s+total(e),0);
 return{t,n,avg:n?Math.round(t/n):0,hr:mm?Math.round(mt/(mm/60)):0,mm}}

async function loadEarnings(){const{data,error}=await sb.from('earnings').select('*,platforms(name)').order('earned_at',{ascending:false}).limit(500);
 return error?[]:data}

async function render(){
 if(!user)return authView();
 if(tab==='inicio')return inicio();if(tab==='ganhos')return ganhos();return perfil()}

async function inicio(){
 shell('<p class="mu">Carregando…</p>');
 const[all,{data:prof}]=await Promise.all([loadEarnings(),sb.from('profiles').select('*').single()]);
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),wk=new Date(d0-6*864e5),mo=new Date(now.getFullYear(),now.getMonth(),1);
 const f=d=>all.filter(e=>new Date(e.earned_at)>=d),today=sum(f(d0)),week=sum(f(wk)),month=sum(f(mo));
 const p=prof||{split_bills_pct:50,split_personal_pct:30,split_reserve_pct:20};
 const r=pc=>brl(Math.round(month.t*pc/100));
 shell(`<h1>Olá${prof?.full_name?', '+esc(prof.full_name.split(' ')[0]):''}</h1><p class="mu">Seu resumo</p>
 <div class="card"><div class="mu">Ganhos de hoje</div><div class="big">${brl(today.t)}</div><div class="mu">${today.n} entregas${today.n?' · média '+brl(today.avg):''}</div></div>
 <div class="grid"><div class="card"><div class="mu">Últimos 7 dias</div><b>${brl(week.t)}</b></div><div class="card"><div class="mu">Este mês</div><b>${brl(month.t)}</b></div>
 <div class="card"><div class="mu">Entregas no mês</div><b>${month.n}</b></div><div class="card"><div class="mu">Ganho por hora</div><b>${month.hr?brl(month.hr):'—'}</b></div></div>
 ${all.length?'':'<div class="card"><b>Comece aqui</b><p class="mu">Registre seu primeiro ganho na aba Ganhos.</p></div>'}
 <h2>Divisão do mês (recomendada)</h2><div class="card">
 <div class="row"><span>Contas ${p.split_bills_pct}%</span><b>${r(p.split_bills_pct)}</b></div>
 <div class="row"><span>Pessoal ${p.split_personal_pct}%</span><b>${r(p.split_personal_pct)}</b></div>
 <div class="row"><span>Reserva ${p.split_reserve_pct}%</span><b>${r(p.split_reserve_pct)}</b></div>
 <p class="mu">Valores recomendados. Isso não significa que o dinheiro já foi guardado.</p></div>`)}

async function ganhos(){
 shell('<p class="mu">Carregando…</p>');
 const[all,{data:pl}]=await Promise.all([loadEarnings(),sb.from('platforms').select('name')]);
 const days={};all.forEach(e=>{const k=new Date(e.earned_at).toLocaleDateString('pt-BR');(days[k]=days[k]||[]).push(e)});
 shell(`<h1>Ganhos</h1><div class="card">
 <input id="app_" list="pls" placeholder="Aplicativo (iFood, 99Food, Keeta…)"><datalist id="pls">${(pl||[]).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <input id="val" inputmode="decimal" placeholder="Valor recebido (R$)">
 <div class="grid"><input id="ent" inputmode="numeric" placeholder="Entregas"><input id="min" inputmode="numeric" placeholder="Minutos trabalhados"></div>
 <div class="grid"><input id="bon" inputmode="decimal" placeholder="Bônus (R$)"><input id="tip" inputmode="decimal" placeholder="Gorjeta (R$)"></div>
 <label class="mu"><input type="checkbox" id="bc" style="width:auto;margin-right:8px">Bônus já confirmado</label><br><br>
 <div class="msg" id="msg"></div><button id="add">Salvar ganho</button></div>
 ${Object.entries(days).map(([k,l])=>`<h2>${k} · ${brl(sum(l).t)}</h2>`+l.map(e=>`<div class="card row"><div><b>${brl(total(e))}</b><div class="mu">${esc(e.platforms?.name||'Sem app')} · ${e.deliveries} entregas</div></div><button class="sm" data-id="${e.id}">Excluir</button></div>`).join('')).join('')}`);
 $('#add').onclick=async()=>{const v=toCents($('#val').value);if(!v)return $('#msg').textContent='Informe o valor recebido.';
  let pid=null;const nm=$('#app_').value.trim();
  if(nm){let{data:ex}=await sb.from('platforms').select('id').ilike('name',nm).maybeSingle();
   if(!ex){const r=await sb.from('platforms').insert({name:nm}).select('id').single();if(r.error)return $('#msg').textContent=r.error.message.includes('FREE')?'Limite do plano FREE: 3 aplicativos.':r.error.message;ex=r.data}pid=ex.id}
  const{error}=await sb.from('earnings').insert({platform_id:pid,amount_cents:v,bonus_cents:toCents($('#bon').value),tips_cents:toCents($('#tip').value),deliveries:parseInt($('#ent').value)||0,minutes_worked:parseInt($('#min').value)||null,bonus_confirmed:$('#bc').checked});
  if(error)return $('#msg').textContent=error.message;ganhos()};
 document.querySelectorAll('button.sm').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este ganho?')){await sb.from('earnings').delete().eq('id',b.dataset.id);ganhos()}})}

async function perfil(){
 const{data:s}=await sb.from('subscriptions').select('plan_id,status').maybeSingle();
 shell(`<h1>Perfil</h1><div class="card"><div class="mu">Conta</div><b>${esc(user.email)}</b><br><br><div class="mu">Plano</div><b>${s?.plan_id==='pro'?'RODDA PRO':'RODDA FREE'}</b><p class="mu">PRO: preço a definir.</p></div><button class="ghost" id="out">Sair</button>`);
 $('#out').onclick=async()=>{await sb.auth.signOut();user=null;render()}}
boot();
</script></body></html>
